[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-server-management"
dynamic = ["version"]
description = "A forever Minecraft server: manages a modded server and upgrades it to the newest release as soon as your mods support it."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcsm = "mcsm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mcsm.__version__" }

[tool.setuptools.package-data]
mcsm = ["webui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
