name: invite page

# craft-conductor's invite page (site/join/), published on GitHub Pages: friends open invite links there.
# Needs Settings → Pages → Build and deployment → Source: "GitHub Actions" (once).
# Published by each release (release.yml), after its downloads exist, since the page links to
# them; run it by hand to publish a change to the page alone.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp src/craft_conductor/webui/icon.png _site/icon.png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
