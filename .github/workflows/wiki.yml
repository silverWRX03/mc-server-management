name: wiki

# The wiki is made from the repository: the user manual (src/craft_conductor/webui/manual.md) split into
# pages with screenshots, plus the hand-written pages in wiki/ (see packaging/wiki.py). Edit those
# files, not the wiki: this publishes them on every change to main (pages written on the wiki
# itself and not made here are left alone).

on:
  push:
    branches: [main]
    paths: ["src/craft_conductor/webui/manual.md", "wiki/**", "packaging/wiki.py", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write   # (the wiki is a git repository next to this one)

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the pages
        run: python packaging/wiki.py wiki-out
      - name: Publish them to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          # Retired screenshots contain obsolete branding; do not leave copies in the wiki.
          rm -f wiki-repo/images/servers.png wiki-repo/images/mods.png wiki-repo/images/java.png \
            wiki-repo/images/friends.png wiki-repo/images/friend-setup.png
          cp -r wiki-out/. wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "The wiki is up to date."; exit 0; fi
          git commit -m "Update from ${GITHUB_SHA::7}: the user manual and the wiki pages"
          git push
