name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    # Windows starts processes slowly: its run takes about 20 minutes (Linux: 2).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Catch packaging problems before release time: build the executable and run it.
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build (Linux, portable)
        if: runner.os == 'Linux'
        run: packaging/build_linux.sh
      - name: Build
        if: runner.os != 'Linux'
        run: |
          pip install "pyinstaller>=6.9,<7"
          pyinstaller --noconfirm packaging/craft-conductor.spec
      - name: Check it runs on an old Linux (CentOS 7, glibc 2.17)
        if: runner.os == 'Linux'
        run: packaging/check_linux_compat.sh dist/craft-conductor
      - name: Smoke test
        shell: bash
        run: python packaging/smoke_test.py dist/craft-conductor$([ -f dist/craft-conductor.exe ] && echo .exe)
      # Test builds: download these from the run's Summary page to try them before a release.
      - name: Name the test build
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Windows-X64) name=craft-conductor-windows-x64.exe ;;
            macOS-ARM64) name=craft-conductor-macos-arm64 ;;
            Linux-X64)   name=craft-conductor-linux-x64 ;;
            Linux-ARM64) name=craft-conductor-linux-arm64 ;;
            *)           name=craft-conductor-${{ runner.os }}-${{ runner.arch }} ;;
          esac
          mkdir -p test-build
          cp dist/craft-conductor$([ -f dist/craft-conductor.exe ] && echo .exe) "test-build/$name"
          echo "BUILD_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: test-build-${{ env.BUILD_NAME }}
          path: test-build/
          retention-days: 14

  docker:
    # The container image builds and starts (the image itself is published by release.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t craft-conductor:ci .
      - name: It starts and answers
        run: |
          docker run -d --name craft-conductor-ci -p 8765:8765 craft-conductor:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/api/auth && break; sleep 1; done
          docker logs craft-conductor-ci 2>&1 | grep -q "one-time" || { docker logs craft-conductor-ci; exit 1; }
          docker stop craft-conductor-ci
