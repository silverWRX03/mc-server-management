# Builds the downloadable executables and publishes a GitHub release.
#
# To release: set __version__ in src/craft_conductor/__init__.py (e.g. "0.2.0") and merge it, then either
#   - Actions -> release -> Run workflow, and enter the version (e.g. 0.2.0), or
#   - git tag v0.2.0 && git push origin v0.2.0
# The first creates the tag itself. Installed copies of craft-conductor find the release and offer to update.
# A beta (a version like 0.3.0b1) is published as a GitHub pre-release: only copies set to the beta
# channel are offered it, and the container image's :latest tag stays on the newest stable release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match __version__ in src/craft_conductor/__init__.py)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import craft_conductor; print(craft_conductor.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::release $TAG doesn't match __version__ $version in src/craft_conductor/__init__.py"; exit 1
          fi
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: craft-conductor-windows-x64.exe
          - os: macos-latest          # Apple silicon
            asset: craft-conductor-macos-arm64
          # Linux builds use a portable Python (packaging/build_linux.sh), so they run
          # on glibc 2.17+ (CentOS 7 onwards) whatever the runner's own version.
          - os: ubuntu-latest
            asset: craft-conductor-linux-x64
          - os: ubuntu-24.04-arm
            asset: craft-conductor-linux-arm64   # e.g. Raspberry Pi 4/5 (64-bit OS)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Built-in CurseForge key (only if the CURSEFORGE_API_KEY secret is set)
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python packaging/write_build_keys.py
      - name: Build (Linux, portable)
        if: runner.os == 'Linux'
        run: packaging/build_linux.sh
      - name: Build
        if: runner.os != 'Linux'
        run: |
          pip install "pyinstaller>=6.9,<7"
          pyinstaller --noconfirm packaging/craft-conductor.spec
      - name: Check it runs on an old Linux (CentOS 7, glibc 2.17)
        if: runner.os == 'Linux'
        run: packaging/check_linux_compat.sh dist/craft-conductor
      - name: Name the executable
        shell: bash
        run: |
          if [ -f dist/craft-conductor.exe ]; then mv dist/craft-conductor.exe "dist/${{ matrix.asset }}"; else mv dist/craft-conductor "dist/${{ matrix.asset }}"; fi
      - name: Smoke test
        run: python packaging/smoke_test.py "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
      # Windows code signing through SignPath Foundation (free for open source), so Windows doesn't
      # say it "protected your PC". Off until the repository has the SIGNPATH_ORGANIZATION_ID
      # variable and the SIGNPATH_API_TOKEN secret (see docs/code-signing.md). SignPath checks the
      # file was built here, from this repository, before it signs it.
      - name: Code-sign (Windows, SignPath)
        id: sign
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'craft-conductor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed file
        if: steps.sign.outcome == 'success'
        shell: bash
        run: |
          mv "signed/${{ matrix.asset }}" "dist/${{ matrix.asset }}"
          python packaging/smoke_test.py "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        if: steps.sign.outcome == 'success'
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the Python package (for pip/pipx)
        run: |
          pip install build
          python -m build --outdir release
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Make the friends' downloads
        # The same program, named to open straight into joining a server.
        working-directory: release
        run: |
          for f in craft-conductor-windows-* craft-conductor-macos-* craft-conductor-linux-*; do
            cp "$f" "craft-conductor-join-${f#craft-conductor-}"
          done
          ls -l
      - name: Checksums
        working-directory: release
        run: |
          chmod +x craft-conductor-*linux-* craft-conductor-*macos-*
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Stable or beta
        id: kind
        # Only a plain vX.Y.Z is a stable release; anything else (v0.3.0b1, v0.3.0rc1) is a beta.
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else echo "prerelease=true" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v3
        with:
          # From "Run workflow" this also creates the tag, on the commit that was built.
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Craft Conductor ${{ env.TAG }} (beta)
          prerelease: ${{ steps.kind.outputs.prerelease }}
          make_latest: ${{ steps.kind.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: release/*
          generate_release_notes: true
          body: |
            > **Craft Conductor is in beta.** It's used and tested, but it's still young: expect rough
            > edges, keep backups (it makes one before every update), and please [report problems](https://github.com/silverWRX03/craft-conductor/issues/new/choose).

            **What's new:** see the [changelog](https://github.com/silverWRX03/craft-conductor/blob/main/CHANGELOG.md).

            ## Download

            | Your computer | File |
            |---|---|
            | Windows 10/11 (64-bit) | `craft-conductor-windows-x64.exe` |
            | Mac with Apple silicon (M1 or newer) | `craft-conductor-macos-arm64` |
            | Linux (64-bit Intel/AMD) | `craft-conductor-linux-x64` |
            | Linux on ARM (e.g. Raspberry Pi 4/5, 64-bit OS) | `craft-conductor-linux-arm64` |
            | Anything else, with Python 3.11+ | `pipx install` the `.whl` file |

            **Joining a friend's server?** Use their invite link, or the `craft-conductor-join-...` file for your
            computer: the same program, opening straight into setting up Minecraft for their server.

            No Python needed for the executables. See the README's "Download and run" section.
            `SHA256SUMS.txt` lets you verify your download; the built-in updater checks it automatically.

  invite-page:
    # The invite page links to this release's downloads (the friends' craft-conductor-join files), so it's
    # published once they exist.
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  docker:
    # The container image, on GitHub's registry: ghcr.io/<owner>/craft-conductor
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Built-in CurseForge key (only if the CURSEFORGE_API_KEY secret is set)
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 packaging/write_build_keys.py
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          # :latest is the newest stable release; a beta moves :beta instead.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "MOVING_TAG=$image:latest" >> "$GITHUB_ENV"
          else echo "MOVING_TAG=$image:beta" >> "$GITHUB_ENV"; fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.MOVING_TAG }}
